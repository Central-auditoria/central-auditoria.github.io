<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#005b8f">
  <title>Login | Central de Auditoria Nissei</title>
  <link rel="stylesheet" href="css/login.css">
  <style>
    .forgot-password {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 8px 4px;
      border: 0;
      background: transparent;
      color: #005b8f;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .forgot-password:hover {
      text-decoration: underline;
    }
    .forgot-password:disabled {
      opacity: .6;
      cursor: default;
    }
  </style>
</head>
<body>
  <main class="login-page">
    <section class="login-card">
      <div class="brand">
        <img src="assets/logo/nissei.webp" alt="Nissei — mais que farmácia">
        <div class="brand-line"></div>
        <p class="eyebrow">NISSEI • AUDITORIA</p>
        <h1>Central de Auditoria</h1>
        <p class="subtitle">Acesse a plataforma de auditoria Nissei.</p>
      </div>

      <form id="loginForm" novalidate>
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" autocomplete="username" placeholder="seu e-mail" required>

        <label for="password">Senha</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="sua senha" required>

        <div id="authMsg" class="message" role="alert" aria-live="polite"></div>

        <button id="loginBtn" class="primary" type="submit">Entrar</button>

        <button id="forgotPasswordBtn" class="forgot-password" type="button">
          Esqueci minha senha
        </button>
      </form>

      <div class="login-footer">
        <span>Acesso restrito</span>
        <span>Central de Auditoria • V1.1</span>
      </div>
    </section>

    <footer>
      Central de Auditoria • V1.1<br>
      Desenvolvido por Diego Nicolato
    </footer>
  </main>

  <script type="module">
    import { supabase } from "./js/auth.js";

    const form = document.getElementById("loginForm");
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const loginBtn = document.getElementById("loginBtn");
    const forgotPasswordBtn = document.getElementById("forgotPasswordBtn");
    const authMsg = document.getElementById("authMsg");

    function showMessage(text, type = "error") {
      authMsg.className = "message " + type;
      authMsg.textContent = text;
    }

    async function redirectIfAlreadyAuthenticated() {
      const { data } = await supabase.auth.getSession();
      if (data?.session?.user) {
        window.location.replace("central/");
      }
    }

    forgotPasswordBtn.addEventListener("click", async () => {
      authMsg.className = "message";
      authMsg.textContent = "";

      const userEmail = email.value.trim();

      if (!userEmail) {
        showMessage("Informe seu e-mail para receber o link de recuperação.");
        email.focus();
        return;
      }

      forgotPasswordBtn.disabled = true;
      forgotPasswordBtn.textContent = "Enviando...";

      const redirectTo = `${window.location.origin}/reset-password.html`;

      const { error } = await supabase.auth.resetPasswordForEmail(userEmail, {
        redirectTo
      });

      forgotPasswordBtn.disabled = false;
      forgotPasswordBtn.textContent = "Esqueci minha senha";

      if (error) {
        showMessage("Não foi possível solicitar a recuperação agora. Tente novamente.");
        return;
      }

      showMessage(
        "Se o e-mail estiver cadastrado, você receberá um link para redefinir sua senha.",
        "success"
      );
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      authMsg.className = "message";
      authMsg.textContent = "";

      const userEmail = email.value.trim();
      const userPassword = password.value;

      if (!userEmail || !userPassword) {
        showMessage("Informe e-mail e senha.");
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = "Entrando...";

      const { data, error } = await supabase.auth.signInWithPassword({
        email: userEmail,
        password: userPassword
      });

      if (error) {
        loginBtn.disabled = false;
        loginBtn.textContent = "Entrar";
        showMessage(error.message);
        return;
      }

      if (!data?.user) {
        loginBtn.disabled = false;
        loginBtn.textContent = "Entrar";
        showMessage("Não foi possível validar a sessão.");
        return;
      }

      const { data: profile, error: profileError } = await supabase
        .from("profiles")
        .select("nome,email,perfil")
        .eq("user_id", data.user.id)
        .maybeSingle();

      if (profileError || !["admin", "auditor"].includes(profile?.perfil)) {
        await supabase.auth.signOut();
        loginBtn.disabled = false;
        loginBtn.textContent = "Entrar";
        showMessage("Usuário autenticado, mas sem perfil autorizado para a Central.");
        return;
      }

      window.location.replace("central/");
    });

    redirectIfAlreadyAuthenticated();
  </script>
</body>
</html>
