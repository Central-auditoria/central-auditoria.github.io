<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#005b8f">
  <title>Redefinir senha | Central de Auditoria Nissei</title>
  <link rel="stylesheet" href="css/login.css">
  <style>
    .reset-actions {
      display: grid;
      gap: 10px;
      margin-top: 18px;
    }
    .message.success {
      color: #166534;
      background: #dcfce7;
      border-color: #86efac;
    }
  </style>
</head>
<body>
  <main class="login-page">
    <section class="login-card">
      <div class="brand">
        <img src="assets/logo/nissei.webp" alt="Nissei — mais que farmácia">
        <div class="brand-line"></div>
        <p class="eyebrow">NISSEI • AUDITORIA</p>
        <h1>Redefinir senha</h1>
        <p class="subtitle">Cadastre uma nova senha para acessar a Central de Auditoria.</p>
      </div>

      <form id="resetForm" novalidate>
        <label for="password">Nova senha</label>
        <input
          id="password"
          type="password"
          autocomplete="new-password"
          placeholder="nova senha"
          minlength="6"
          required
        >

        <label for="confirmPassword">Confirmar nova senha</label>
        <input
          id="confirmPassword"
          type="password"
          autocomplete="new-password"
          placeholder="repita a nova senha"
          minlength="6"
          required
        >

        <div id="resetMsg" class="message" role="alert" aria-live="polite"></div>

        <div class="reset-actions">
          <button id="resetBtn" class="primary" type="submit">Salvar nova senha</button>
          <button id="backBtn" class="forgot-password" type="button">Voltar para o login</button>
        </div>
      </form>

      <div class="login-footer">
        <span>Acesso restrito</span>
        <span>Central de Auditoria • V1.1</span>
      </div>
    </section>

    <footer>
      Central de Auditoria • V1.1<br>
      Desenvolvido por Diego Nicolato
    </footer>
  </main>

  <script type="module">
    import { supabase } from "./js/auth.js";

    const form = document.getElementById("resetForm");
    const password = document.getElementById("password");
    const confirmPassword = document.getElementById("confirmPassword");
    const resetBtn = document.getElementById("resetBtn");
    const backBtn = document.getElementById("backBtn");
    const resetMsg = document.getElementById("resetMsg");

    function showMessage(text, type = "error") {
      resetMsg.className = "message " + type;
      resetMsg.textContent = text;
    }

    backBtn.addEventListener("click", () => {
      window.location.replace("./");
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      resetMsg.className = "message";
      resetMsg.textContent = "";

      const newPassword = password.value;
      const confirmation = confirmPassword.value;

      if (!newPassword || !confirmation) {
        showMessage("Preencha os dois campos.");
        return;
      }

      if (newPassword.length < 6) {
        showMessage("A nova senha deve ter pelo menos 6 caracteres.");
        return;
      }

      if (newPassword !== confirmation) {
        showMessage("As senhas não conferem.");
        return;
      }

      resetBtn.disabled = true;
      resetBtn.textContent = "Salvando...";

      const { error } = await supabase.auth.updateUser({
        password: newPassword
      });

      if (error) {
        resetBtn.disabled = false;
        resetBtn.textContent = "Salvar nova senha";
        showMessage("Não foi possível redefinir a senha. Solicite um novo link de recuperação.");
        return;
      }

      showMessage("Senha alterada com sucesso. Você já pode acessar a Central.", "success");
      resetBtn.textContent = "Senha alterada";

      setTimeout(() => {
        window.location.replace("./");
      }, 1800);
    });
  </script>
</body>
</html>
