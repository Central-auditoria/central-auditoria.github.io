<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Filiais — Central de Auditoria Nissei</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fa}
  .card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;box-shadow:0 8px 24px rgba(15,23,42,.05)}
  .btn{border-radius:10px;padding:.65rem 1rem;font-weight:700;transition:.15s}
  .btn-primary{background:#111827;color:#fff}.btn-primary:hover{background:#1f2937}
  .btn-danger{background:#fee2e2;color:#b91c1c}.btn-danger:hover{background:#fecaca}
  .muted{color:#64748b}
  .pill{display:inline-flex;align-items:center;border-radius:999px;padding:.25rem .65rem;font-size:.75rem;font-weight:800}

  .hidden{display:none!important}
  .history-row{display:grid;grid-template-columns:1.1fr 1fr 1fr .9fr auto;gap:10px;align-items:center;padding:14px 0;border-bottom:1px solid #e5e7eb}
  .history-row:last-child{border-bottom:0}
  .history-muted{color:#64748b;font-size:13px}
  .snapshot-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:18px}
  .snapshot-box{border:1px solid #e2e8f0;border-radius:12px;padding:12px;background:#f8fafc}
  .snapshot-label{display:block;color:#64748b;font-size:12px;margin-bottom:4px}
  .snapshot-value{font-weight:700;word-break:break-word}
  .snapshot-section{margin-top:18px}
  .snapshot-section h3{margin:0 0 10px}
  .snapshot-pre{white-space:pre-wrap;background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:14px;line-height:1.5}
  .modal{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
  .modal-backdrop{position:absolute;inset:0;background:rgba(15,23,42,.62)}
  .modal-card{position:relative;width:min(980px,96vw);max-height:92vh;overflow:auto;background:#fff;border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.28);padding:24px}
  .modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px}
  @media(max-width:760px){
    .history-row{grid-template-columns:1fr}
    .snapshot-grid{grid-template-columns:1fr}
    .modal-head{flex-direction:column}
  }

</style>
</head>
<body class="min-h-screen">
<header class="bg-white border-b border-slate-200 sticky top-0 z-20">
  <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between gap-4">
    <div>
      <div class="text-xs font-bold tracking-widest text-slate-500 uppercase">Central de Auditoria Nissei</div>
      <h1 class="text-2xl font-black text-slate-900">Filiais</h1>
    </div>
    <div class="flex items-center gap-3">
      <span id="userProfile" class="text-sm font-semibold text-slate-600"></span>
      <button id="logoutBtn" class="btn border border-slate-200 text-slate-700 bg-white">← Voltar à Central</button>
    </div>
  </div>
</header>

<main class="max-w-6xl mx-auto px-4 py-8 space-y-6">
  <section class="card p-5">
    <div class="flex flex-col md:flex-row md:items-end gap-3">
      <div class="flex-1">
        <label for="numeroFilial" class="block text-sm font-bold text-slate-700 mb-2">Número da filial</label>
        <input id="numeroFilial" inputmode="numeric" autocomplete="off"
          class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:ring-2 focus:ring-slate-400"
          placeholder="Ex.: 123">
      </div>
      <button id="buscarBtn" class="btn btn-primary">Buscar filial</button>
    </div>
    <p id="status" class="text-sm mt-3 muted"></p>
  </section>

  <section id="resultado" class="hidden space-y-6">
    <div class="card p-6">
      <div class="flex flex-col md:flex-row md:items-start md:justify-between gap-4">
        <div>
          <div class="text-sm font-bold text-slate-500 uppercase tracking-wide">Filial</div>
          <h2 id="filialTitulo" class="text-3xl font-black text-slate-900 mt-1"></h2>
          <p id="filialNome" class="text-slate-600 mt-1"></p>
        </div>
        <button id="excluirBtn" class="hidden btn btn-danger">Excluir filial</button>
      </div>

      <div class="grid md:grid-cols-3 gap-4 mt-6">
        <div class="rounded-xl bg-slate-50 p-4">
          <div class="text-xs font-bold uppercase text-slate-500">Gestor atual</div>
          <div id="gestorAtual" class="font-bold text-slate-900 mt-2">—</div>
        </div>
        <div class="rounded-xl bg-slate-50 p-4">
          <div class="text-xs font-bold uppercase text-slate-500">Auditor do último balanço</div>
          <div id="auditorAtual" class="font-bold text-slate-900 mt-2">—</div>
        </div>
        <div class="rounded-xl bg-slate-50 p-4">
          <div class="text-xs font-bold uppercase text-slate-500">Última atualização</div>
          <div id="ultimaAtualizacao" class="font-bold text-slate-900 mt-2">—</div>
        </div>
      </div>
    </div>

    <div class="card p-6">
      <div class="flex items-center justify-between gap-3 mb-4">
        <div>
          <h3 class="text-xl font-black text-slate-900">Histórico de Relatórios de Perdas</h3>
          <p class="text-sm muted mt-1">Relatórios vinculados ao número desta filial.</p>
        </div>
        <span id="contadorRelatorios" class="pill bg-slate-100 text-slate-700">0</span>
      </div>
      <div id="historico" class="space-y-3"></div>
    </div>
  </section>
</main>

<div id="snapshotModal" class="modal hidden" aria-hidden="true">
  <div class="modal-backdrop" data-close-snapshot></div>
  <div class="modal-card">
    <div class="modal-head">
      <div>
        <h2 id="snapshotTitulo" style="margin:0;">Snapshot do Relatório</h2>
        <p id="snapshotSubtitulo" style="margin:6px 0 0;color:#64748b;"></p>
      </div>
      <button type="button" class="btn secondary" data-close-snapshot>Fechar</button>
    </div>
    <div id="snapshotConteudo" class="snapshot-content"></div>
  </div>
</div>


<div id="modal" class="hidden fixed inset-0 bg-slate-900/50 z-50 items-center justify-center p-4">
  <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl">
    <h3 class="text-xl font-black text-slate-900">Excluir filial?</h3>
    <p id="modalTexto" class="text-slate-600 mt-3"></p>
    <div class="flex justify-end gap-3 mt-6">
      <button id="cancelarExclusao" class="btn border border-slate-200 text-slate-700">Cancelar</button>
      <button id="confirmarExclusao" class="btn btn-danger">Excluir filial</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://skfpqaxbypryztznakke.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_Cdgo8O0bLb1Jd1uTuhlp1A_qTJpbbXj';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

let currentUser = null;
let currentProfile = null;
let currentFilial = null;

const $ = id => document.getElementById(id);

function escapeHtml(value){
  return String(value ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
  }[c]));
}

function formatDate(value){
  if(!value) return '—';
  const d = new Date(value);
  if(Number.isNaN(d.getTime())) return value;
  return d.toLocaleString('pt-BR');
}

function setStatus(text, error=false){
  $('status').textContent = text || '';
  $('status').className = 'text-sm mt-3 ' + (error ? 'text-red-600' : 'muted');
}

async function carregarUsuario(){
  const {data:{session},error} = await supabaseClient.auth.getSession();
  if(error) throw error;
  if(!session){
    throw new Error('Sessão do Supabase não foi encontrada nesta página. Abra o módulo Filiais pela Central após fazer login.');
  }

  currentUser=session.user;

  const profileResult=await supabaseClient
    .from('profiles')
    .select('user_id,nome,matricula,perfil')
    .eq('user_id',currentUser.id)
    .maybeSingle();

  if(profileResult.error) throw profileResult.error;
  currentProfile=profileResult.data;

  if(!['admin','auditor'].includes(currentProfile.perfil)){
    document.body.innerHTML='<div class="min-h-screen flex items-center justify-center p-6"><div class="card p-8 max-w-lg text-center"><h1 class="text-2xl font-black">Acesso não autorizado</h1><p class="text-slate-600 mt-3">Seu perfil não possui acesso ao módulo Filiais.</p></div></div>';
    return false;
  }

  $('userProfile').textContent = `${currentProfile.nome || ''} · ${currentProfile.perfil}`;
  if(currentProfile.perfil === 'admin') $('excluirBtn').classList.remove('hidden');
  return true;
}

async function buscarFilial(){
  const numero=$('numeroFilial').value.trim();
  if(!numero){
    setStatus('Informe o número da filial.',true);
    $('resultado').classList.add('hidden');
    return;
  }

  setStatus('Buscando...');
  $('resultado').classList.add('hidden');

  const filialResult=await supabaseClient
    .from('filiais')
    .select('*')
    .eq('codigo',Number(numero))
    .maybeSingle();

  if(filialResult.error){
    setStatus('Erro ao buscar filial: '+filialResult.error.message,true);
    return;
  }

  if(!filialResult.data){
    setStatus('Filial não encontrada no cadastro.',true);
    return;
  }

  currentFilial=filialResult.data;
  renderFilial(currentFilial);
  await carregarHistorico(currentFilial);
  $('resultado').classList.remove('hidden');
  setStatus('');
}

function renderFilial(f){
  $('filialTitulo').textContent=`Filial ${f.codigo ?? ''}`;
  $('filialNome').textContent=f.nome_atual || 'Nome não informado';
  $('gestorAtual').textContent=f.gestor_nome
    ? `${f.gestor_nome}${f.gestor_matricula ? ' — '+f.gestor_matricula : ''}`
    : '—';
  $('auditorAtual').textContent=f.auditor_ultimo_balanco_nome
    ? `${f.auditor_ultimo_balanco_nome}${f.auditor_ultimo_balanco_matricula ? ' — '+f.auditor_ultimo_balanco_matricula : ''}`
    : '—';
  $('ultimaAtualizacao').textContent=formatDate(f.ultima_atualizacao || f.atualizado_em || f.atualizado_em);
}

async function carregarHistorico(f){
  $('historico').innerHTML='<div class="text-sm muted">Carregando histórico...</div>';

  // A busca do histórico usa o número da filial armazenado no snapshot.
  // Isso preserva o histórico mesmo quando o cadastro atual do gestor muda.
  const result=await supabaseClient
    .from('relatorios_perdas')
    .select('id,status,created_at,finalized_at,snapshot')
    .order('created_at',{ascending:false});

  if(result.error){
    $('historico').innerHTML=`<div class="text-sm text-red-600">Erro ao carregar histórico: ${escapeHtml(result.error.message)}</div>`;
    return;
  }

  const numero=String(f.codigo);
  const relatorios=(result.data||[]).filter(r=>{
    const snap=r.snapshot || {};
    const entrada=snap.entrada || {};
    const valor=entrada.filial ?? snap.filial ?? '';
    const raw=String(valor).trim();
    return raw === numero || raw.startsWith(numero+' —') || raw.startsWith(numero+' -') || raw.startsWith(numero+' –');
  });

  $('contadorRelatorios').textContent=relatorios.length;

  if(!relatorios.length){
    $('historico').innerHTML='<div class="rounded-xl bg-slate-50 p-5 text-sm text-slate-600">Nenhum relatório encontrado para esta filial.</div>';
    return;
  }

  // Busca os encerramentos separadamente para manter o módulo compatível
  // mesmo se algum relatório ainda não possuir encerramento.
  const ids=relatorios.map(r=>r.id);
  const encerramentos=await supabaseClient
    .from('relatorios_perdas_encerramentos')
    .select('id,relatorio_id,intercorrencia,intercorrencia_descricao,checklist_facil,checklist_facil_descricao,registrado_em,registrado_por')
    .in('relatorio_id',ids);

  const mapa=new Map((encerramentos.data||[]).map(e=>[e.relatorio_id,e]));

  $('historico').innerHTML=relatorios.map(r=>{
    const snap=r.snapshot||{};
    const entrada=snap.entrada||{};
    const auditor=entrada.auditor || snap.auditor || '—';
    const enc=mapa.get(r.id);
    const status=(r.status||'').toLowerCase();
    const statusLabel=status==='finalizado'?'Finalizado':(status||'Em andamento');
    const statusClass=status==='finalizado'?'bg-green-100 text-green-700':'bg-amber-100 text-amber-700';

    return `
      <div class="rounded-xl border border-slate-200 p-5">
        <div class="flex flex-col md:flex-row md:items-start md:justify-between gap-3">
          <div>
            <div class="font-black text-slate-900">Relatório de Perdas</div>
            <div class="text-sm text-slate-600 mt-1">Auditor: ${escapeHtml(auditor)}</div>
            <div class="text-sm text-slate-600">Criado: ${escapeHtml(formatDate(r.created_at))}</div>
            ${r.finalized_at ? `<div class="text-sm text-slate-600">Finalizado: ${escapeHtml(formatDate(r.finalized_at))}</div>` : ''}
          </div>
          <span class="pill ${statusClass}">${escapeHtml(statusLabel)}</span>
        </div>

        ${enc ? `
          <div class="mt-4 pt-4 border-t border-slate-100">
            <div class="text-sm font-black text-slate-800">Encerramento</div>
            <div class="grid md:grid-cols-2 gap-3 mt-3">
              <div class="rounded-lg bg-slate-50 p-3">
                <div class="text-xs font-bold uppercase text-slate-500">Intercorrência</div>
                <div class="font-bold mt-1">${enc.intercorrencia ? 'Sim' : 'Não'}</div>
                ${enc.intercorrencia && enc.intercorrencia_descricao ? `<div class="text-sm text-slate-600 mt-1">${escapeHtml(enc.intercorrencia_descricao)}</div>` : ''}
              </div>
              <div class="rounded-lg bg-slate-50 p-3">
                <div class="text-xs font-bold uppercase text-slate-500">Checklist Fácil</div>
                <div class="font-bold mt-1">${enc.checklist_facil ? 'Sim' : 'Não'}</div>
                ${enc.checklist_facil && enc.checklist_facil_descricao ? `<div class="text-sm text-slate-600 mt-1">${escapeHtml(enc.checklist_facil_descricao)}</div>` : ''}
              </div>
            </div>
            <div class="mt-4 flex flex-wrap gap-2">
              <button type="button" class="btn btn-primary" onclick="abrirRelatorio('${escapeHtml(r.id)}')">Abrir relatório completo</button>
            </div>
            <div class="text-xs text-slate-500 mt-3">Encerrado em ${escapeHtml(formatDate(enc.registrado_em))}</div>
          </div>
        ` : `
          <div class="mt-4 pt-4 border-t border-slate-100 text-sm text-slate-500">
            Este relatório ainda não possui encerramento registrado.
            <div class="mt-4">
              <button type="button" class="btn btn-primary" onclick="abrirRelatorio('${escapeHtml(r.id)}')">Abrir relatório completo</button>
            </div>
          </div>
        `}
      </div>`;
  }).join('');
}

function abrirModalExclusao(){
  if(!currentFilial || currentProfile?.perfil!=='admin') return;
  $('modalTexto').textContent=`A filial ${currentFilial.codigo}${currentFilial.nome_atual ? ' — '+currentFilial.nome_atual : ''} será removida do cadastro atual. Os Relatórios de Perdas e seus históricos NÃO serão excluídos.`;
  $('modal').classList.remove('hidden');
  $('modal').classList.add('flex');
}

function fecharModal(){
  $('modal').classList.add('hidden');
  $('modal').classList.remove('flex');
}

async function excluirFilial(){
  if(!currentFilial || currentProfile?.perfil!=='admin') return;

  $('confirmarExclusao').disabled=true;
  $('confirmarExclusao').textContent='Excluindo...';

  const result=await supabaseClient
    .from('filiais')
    .delete()
    .eq('id',currentFilial.id);

  $('confirmarExclusao').disabled=false;
  $('confirmarExclusao').textContent='Excluir filial';

  if(result.error){
    fecharModal();
    setStatus('Erro ao excluir filial: '+result.error.message,true);
    return;
  }

  fecharModal();
  currentFilial=null;
  $('resultado').classList.add('hidden');
  setStatus('Filial excluída do cadastro. Os relatórios históricos foram preservados.');
}

$('buscarBtn').addEventListener('click',buscarFilial);
$('numeroFilial').addEventListener('keydown',e=>{if(e.key==='Enter') buscarFilial();});
$('excluirBtn').addEventListener('click',abrirModalExclusao);
$('cancelarExclusao').addEventListener('click',fecharModal);
$('confirmarExclusao').addEventListener('click',excluirFilial);
$('logoutBtn').addEventListener('click',()=>{
  if (document.referrer && history.length > 1) {
    history.back();
  } else {
    window.location.href = '../../central/index.html';
  }
});

(async()=>{
  try{
    const ok=await carregarUsuario();
    if(ok) $('numeroFilial').focus();
  }catch(error){
    console.error('Erro ao iniciar Filiais:',error);
    $('resultado').classList.add('hidden');
    setStatus('Erro ao iniciar o módulo Filiais: '+(error?.message || error),true);
  }
})();

function escapeHtml(value){
  return String(value ?? '').replace(/[&<>"']/g,ch=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
  }[ch]));
}

function parseFilialCadastro(value){
  const texto=String(value ?? '').trim();
  if(!texto) return {numero:'',nome:''};

  // Aceita formatos como:
  // "123 - Teste", "123 — Teste", "Filial 123 - Teste"
  const m=texto.match(/(?:filial\s*)?(\d+)\s*(?:-|—|–|:)\s*(.*)$/i);
  if(m){
    return {numero:m[1],nome:(m[2] || '').trim()};
  }

  const somenteNumero=texto.match(/^\d+$/);
  if(somenteNumero){
    return {numero:texto,nome:''};
  }

  return {numero:'',nome:texto};
}

function abrirRelatorio(reportId){
  if(!reportId) return;
  const base='../../modulos/perdas/';
  window.location.href=`${base}?relatorio=${encodeURIComponent(reportId)}`;
}

async function abrirSnapshot(reportId){
  const modal=document.getElementById('snapshotModal');
  const titulo=document.getElementById('snapshotTitulo');
  const subtitulo=document.getElementById('snapshotSubtitulo');
  const conteudo=document.getElementById('snapshotConteudo');
  if(!modal || !reportId) return;

  titulo.textContent='Snapshot do Relatório de Perdas';
  subtitulo.textContent='Carregando...';
  conteudo.innerHTML='<div class="history-muted">Carregando snapshot...</div>';
  modal.classList.remove('hidden');
  modal.setAttribute('aria-hidden','false');

  try{
    const {data,error}=await supabaseClient
      .from('relatorios_perdas')
      .select('id,status,created_at,finalized_at,snapshot')
      .eq('id',reportId)
      .single();

    if(error) throw error;

    const snap=data.snapshot ?? {};
    const entrada=snap.entrada ?? {};
    const rel=snap.currentReport ?? {};

    const pick=(...values)=>{
      for(const v of values){
        if(v!==undefined && v!==null && String(v).trim()!=='') return v;
      }
      return '—';
    };

    const filialRaw=pick(entrada.filial,rel.filial,snap.filial);
    const filialIdent=parseFilialCadastro(filialRaw);
    const filialTexto=filialIdent.numero
      ? `${filialIdent.numero}${filialIdent.nome ? ' — '+filialIdent.nome : ''}`
      : filialRaw;

    const gestor=pick(entrada.gestor,rel.gestor,snap.gestor);
    const auditor=pick(entrada.auditor,rel.auditor,snap.auditor);

    const cicloAtual=pick(entrada.cicloAtual,rel.cicloAtual);
    const cicloAnterior=pick(entrada.cicloAnt,rel.cicloAnt);

    const faturamentoAtual=pick(rel.fatAtual,entrada.fatAtual);
    const faturamentoAnterior=pick(rel.fatAnt,entrada.fatAnt);
    const indicadorAtual=pick(rel.indAtual,entrada.indAtual);
    const indicadorAnterior=pick(rel.indAnt,entrada.indAnt);
    const resultadoAtual=pick(rel.resAtual);
    const resultadoAnterior=pick(rel.resAnt,entrada.resAntInput);
    const perdaLiquida=pick(rel.perdaLiquidaAtual);
    const falta=pick(rel.falta);
    const sobra=pick(rel.sobra);
    const geral=pick(rel.geral);
    const meta=pick(rel.meta,entrada.meta);

    titulo.textContent='Snapshot do Relatório de Perdas';
    subtitulo.textContent=`Relatório ${data.id || '—'} • ${data.status || '—'}`;

    conteudo.innerHTML=`
      <div class="snapshot-section">
        <h3>Identificação</h3>
        <div class="snapshot-grid">
          ${snapshotBox('Filial', filialTexto)}
          ${snapshotBox('Data do relatório', formatDateTime(data.finalized_at || data.created_at))}
          ${snapshotBox('Gestor', gestor)}
          ${snapshotBox('Auditor', auditor)}
          ${snapshotBox('Ciclo atual', cicloAtual)}
          ${snapshotBox('Ciclo anterior', cicloAnterior)}
        </div>
      </div>

      <div class="snapshot-section">
        <h3>Resultados do relatório</h3>
        <div class="snapshot-grid">
          ${snapshotBox('Faturamento atual', formatMoney(faturamentoAtual))}
          ${snapshotBox('Faturamento anterior', formatMoney(faturamentoAnterior))}
          ${snapshotBox('Total de falta', formatMoney(falta))}
          ${snapshotBox('Total de sobra', formatMoney(sobra))}
          ${snapshotBox('Resultado geral', formatMoney(geral))}
          ${snapshotBox('Indicador operacional atual', formatPercent(indicadorAtual))}
          ${snapshotBox('Indicador operacional anterior', formatPercent(indicadorAnterior))}
          ${snapshotBox('Resultado final atual', formatPercent(resultadoAtual))}
          ${snapshotBox('Resultado final anterior', formatPercent(resultadoAnterior))}
          ${snapshotBox('Perda líquida', formatPercent(perdaLiquida))}
          ${snapshotBox('Meta', formatPercent(meta))}
        </div>
      </div>

      ${snapshotSection('Intercorrências',pick(snap.intercorrencias,snap.intercorrencia))}
      ${(snap.encerramento || snap.observacoes_encerramento) ? `<div class="snapshot-section"><h3>Encerramento</h3>${humanizeEncerramento(snap.encerramento || snap.observacoes_encerramento)}</div>` : ''}
      ${snapshotSection('Medidas disciplinares',pick(snap.medidas_disciplinares,snap.medida_disciplinar,snap.medidasDisciplinares))}

      <div class="snapshot-section">
        <h3>Informações detalhadas do relatório</h3>
        <div class="snapshot-grid">
          ${snapshotBox('Itens de falta no ranking',Array.isArray(rel.faltas)?rel.faltas.length:'—')}
          ${snapshotBox('Itens de sobra no ranking',Array.isArray(rel.sobras)?rel.sobras.length:'—')}
          ${snapshotBox('Setores ofensores',Array.isArray(rel.setores)?rel.setores.length:'—')}
          ${snapshotBox('Versão do snapshot',pick(snap.version))}
        </div>
      </div>

      <details class="snapshot-section">
        <summary style="cursor:pointer;font-weight:800;">Ver dados técnicos completos do snapshot</summary>
        <pre class="snapshot-pre" style="margin-top:10px;">${escapeHtml(JSON.stringify(snap,null,2))}</pre>
      </details>
    `;
  }catch(error){
    console.error('Erro ao carregar snapshot:',error);
    conteudo.innerHTML=`<div class="history-muted" style="color:#b91c1c;">Erro ao carregar o snapshot: ${escapeHtml(error.message || String(error))}</div>`;
    subtitulo.textContent='Não foi possível carregar o snapshot.';
  }
}

function formatMoney(value){
  if(value===undefined || value===null || value==='' || value==='—') return '—';
  const n=Number(value);
  if(!Number.isFinite(n)) return String(value);
  return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
}

function formatPercent(value){
  if(value===undefined || value===null || value==='' || value==='—') return '—';
  const n=Number(value);
  if(!Number.isFinite(n)) return String(value);
  return `${(n*100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:4})}%`;
}

function formatDateTime(value){
  if(!value || value==='—') return '—';
  const d=new Date(value);
  if(Number.isNaN(d.getTime())) return String(value);
  return d.toLocaleString('pt-BR');
}

function humanizeEncerramento(value){
  if(!value || value==='—') return '';
  let obj=value;
  if(typeof value==='string'){
    try{ obj=JSON.parse(value); }catch(_){ return `<div class="snapshot-pre">${escapeHtml(value)}</div>`; }
  }
  if(typeof obj!=='object' || Array.isArray(obj)){
    return `<div class="snapshot-pre">${escapeHtml(String(value))}</div>`;
  }

  const labels={
    id:'Identificador',
    intercorrencia:'Intercorrência',
    checklist_facil:'Checklist fácil',
    intercorrencia_descricao:'Descrição da intercorrência',
    checklist_facil_descricao:'Descrição do checklist',
    encerramento_registrado_em:'Registrado em'
  };

  const entries=Object.entries(obj).filter(([_,v])=>v!==undefined && v!==null && String(v).trim()!=='');
  return `<div class="snapshot-grid snapshot-encerramento">
    ${entries.map(([key,value])=>{
      let display=value;
      if(key==='encerramento_registrado_em') display=formatDateTime(value);
      else if(typeof value==='boolean') display=value?'Sim':'Não';
      return snapshotBox(labels[key] || key.replaceAll('_',' '),display);
    }).join('')}
  </div>`;
}

function snapshotBox(label,value){
  return `<div class="snapshot-box"><span class="snapshot-label">${escapeHtml(label)}</span><span class="snapshot-value">${escapeHtml(value)}</span></div>`;
}

function snapshotSection(title,value){
  if(value==='—' || value===null || value===undefined || String(value).trim()==='') return '';
  const text=typeof value==='object' ? JSON.stringify(value,null,2) : String(value);
  return `<div class="snapshot-section"><h3>${escapeHtml(title)}</h3><div class="snapshot-pre">${escapeHtml(text)}</div></div>`;
}

function fecharSnapshot(){
  const modal=document.getElementById('snapshotModal');
  if(!modal) return;
  modal.classList.add('hidden');
  modal.setAttribute('aria-hidden','true');
}

document.addEventListener('click',event=>{
  if(event.target.matches('[data-close-snapshot]')) fecharSnapshot();
});
document.addEventListener('keydown',event=>{
  if(event.key==='Escape') fecharSnapshot();
});

</script>
</body>
</html>
